name: Effect audit and tests
on:
  push:
    branches: [main]
    paths:
      - "data/cards.json"
      - "js/effect-engine.js"
      - "js/effect-runtime.js"
      - "js/game.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/effect-tests.yml"
  pull_request:
    paths:
      - "data/cards.json"
      - "js/effect-engine.js"
      - "js/effect-runtime.js"
      - "js/game.js"
      - "tests/**"
      - ".github/workflows/effect-tests.yml"
  workflow_dispatch:
concurrency:
  group: effect-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  effect-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all effect tests and audits
        run: npm run test:all
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-audit-reports
          path: |
            effect-compiler-audit-report.json
            effect-live-audit-report.json
