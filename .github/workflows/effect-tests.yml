name: Effect audit and tests
on:
  push:
    branches: [main]
    paths:
      - "data/cards.json"
      - "js/effect-engine.js"
      - "js/effect-runtime.js"
      - "tests/**"
      - ".github/workflows/effect-tests.yml"
  pull_request:
    paths:
      - "data/cards.json"
      - "js/effect-engine.js"
      - "js/effect-runtime.js"
      - "tests/**"
      - ".github/workflows/effect-tests.yml"
  workflow_dispatch:
jobs:
  effect-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run effect regression tests
        run: node tests/effect-tests.js
      - name: Generate all-card audit
        run: node tests/effect-audit.js effect-audit-report.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-audit-report
          path: effect-audit-report.json
